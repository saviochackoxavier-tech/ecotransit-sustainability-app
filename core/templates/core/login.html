{% extends "core/base.html" %}
{% block title %}Log in — EcoTransit{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-6 py-24">
    <h1 class="text-2xl font-semibold mb-1">EcoTransit</h1>
    <p class="text-slate text-sm mb-8">Log in to track your journeys.</p>

    {% if form.errors %}
    <p class="text-sm text-red-700 mb-4">Your username and password didn't match. Try again.</p>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_username" class="block text-sm mb-1">Username</label>
            <input type="text" name="username" id="id_username" required autofocus
                   class="w-full border border-sageline rounded px-3 py-2 bg-white">
        </div>
        <div>
            <label for="id_password" class="block text-sm mb-1">Password</label>
            <input type="password" name="password" id="id_password" required
                   class="w-full border border-sageline rounded px-3 py-2 bg-white">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full bg-pine text-white rounded px-3 py-2 text-sm font-medium hover:bg-pine/90 transition-colors">
            Log in
        </button>
    </form>
</div>
{% endblock %}
